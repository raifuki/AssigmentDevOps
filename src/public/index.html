<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh mục sản phẩm</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Quản lý kho hàng</p>
          <h1>Danh mục sản phẩm</h1>
        </div>
        <button class="secondary-btn" type="button" id="reset-button">Làm mới</button>
      </header>

      <section class="stats-grid" aria-label="Thống kê kho hàng">
        <article class="stat-card">
          <span class="stat-label">Tổng sản phẩm</span>
          <strong class="stat-value" id="product-count">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Tổng giá trị</span>
          <strong class="stat-value" id="total-value">0₫</strong>
        </article>
      </section>

      <main class="content-grid">
        <section class="panel">
          <div class="panel-header">
            <h2 id="form-title">Thêm sản phẩm mới</h2>
          </div>

          <form id="product-form">
            <input type="hidden" id="product-id" />

            <div class="field-row">
              <label for="name">Tên sản phẩm</label>
              <input id="name" name="name" type="text" placeholder="Ví dụ: Bàn phím cơ" required />
            </div>

            <div class="field-row">
              <label for="description">Mô tả</label>
              <textarea id="description" name="description" rows="3" placeholder="Mô tả ngắn về sản phẩm"></textarea>
            </div>

            <div class="field-row two-columns">
              <div>
                <label for="price">Giá (VND)</label>
                <input id="price" name="price" type="number" min="0" step="1000" placeholder="2249750" required />
              </div>
              <div>
                <label for="stock">Số lượng tồn</label>
                <input id="stock" name="stock" type="number" min="0" step="1" placeholder="12" required />
              </div>
            </div>

            <div class="field-row two-columns">
              <div>
                <label for="sku">SKU</label>
                <input id="sku" name="sku" type="text" placeholder="KEY-001" />
              </div>
              <div>
                <label for="category">Phân loại</label>
                <input id="category" name="category" type="text" placeholder="Phụ kiện" />
              </div>
            </div>

            <div class="actions">
              <button class="primary-btn" type="submit" id="submit-button">Thêm sản phẩm</button>
              <button class="ghost-btn" type="button" id="cancel-button">Hủy</button>
            </div>

            <p id="form-message" class="form-message" aria-live="polite"></p>
          </form>
        </section>

        <section class="panel table-panel">
          <div class="panel-header">
            <h2>Danh sách hiện tại</h2>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Sản phẩm</th>
                  <th>Phân loại</th>
                  <th>Giá</th>
                  <th>Tồn kho</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody id="product-table-body">
                <tr id="empty-state">
                  <td colspan="6" class="empty-state">Chưa có sản phẩm nào trong danh mục.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="/catalog.js"></script>
  </body>
</html>
